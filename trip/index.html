const POOL = {kk:{},ut:{}}; for(const r of ["kk","ut"]) for(const [,items] of EXTRA[r]) for(const it of items) POOL[r][it.k]=it;

// ===== planner =====
const planners = {};
const fmtIn = m=>String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(Math.round(m)%60).padStart(2,"0");
function Planner(cfg){
  const BASE = cfg.stops.map(s=>s.k);
  const BY = Object.assign({}, POOL[cfg.region], Object.fromEntries(cfg.stops.map(s=>[s.k,s])));
  const DEFAULT = {order:BASE.slice(), off:{}, pin:{}, dur:{}};
  const clone = o=>JSON.parse(JSON.stringify(o));
  let state = (()=>{ try{ const s=JSON.parse(localStorage.getItem(cfg.key));
    if(s&&Array.isArray(s.order)&&s.order.every(k=>BY[k])&&BASE.every(k=>s.order.includes(k))&&s.order[0]===BASE[0]&&s.order[s.order.length-1]===BASE[BASE.length-1]) return Object.assign({pin:{},dur:{}},s); }catch(e){} return clone(DEFAULT); })();
  let hist = [], editing = null;
  const save = ()=>{ try{ localStorage.setItem(cfg.key, JSON.stringify(state)); }catch(e){} };
  const commit = fn=>{ hist.push(clone(state)); fn(); save(); renderAll(); };
  const est = (a,b)=> (cfg.est && cfg.est(a,b,BY)) ?? roadMin(a,b);
  const dur = s=> state.dur[s.k] ?? s.dur;
  const wd = cfg.date.getDay();

  function plan(){
    const seq = state.order.map(k=>BY[k]);
    const t0 = state.pin[seq[0].k] ?? cfg.start;
    let t = t0, prev = seq[0], pend = [], out = [{s:prev, arr:t0, dep:t0}], drive = 0, inlArr = {};
    for(let i=1;i<seq.length;i++){
      const s = seq[i];
      if(state.off[s.k]){ out.push({s, skipped:true}); continue; }
      if(s.inline){ pend.push(s); out.push({s}); continue; }
      const leg = est(prev, s); let cur = t, driven = 0;
      for(const p of pend){ const d = Math.max(0, Math.min(p.offset, leg) - driven); cur += d; driven += d;
        if(state.pin[p.k]!=null) cur = state.pin[p.k]; inlArr[p.k] = cur; cur += dur(p); }
      let arr = cur + (leg - driven), wait = 0, pinned = state.pin[s.k]!=null;
      if(pinned) arr = state.pin[s.k];
      else if(s.open && arr < toMin(s.open)){ wait = toMin(s.open)-arr; arr = toMin(s.open); }
      out.push({s, arr, dep: arr + dur(s), leg, wait, inl:pend, pinned});
      drive += leg; t = arr + dur(s); prev = s; pend = [];
    }
    return {out, inlArr, end:t, drive};
  }

  function editor(s, curTime){
    const isEnd = s.fixed==="end", isStart = s.fixed==="start";
    return `<div class="edit">
      <label>${isStart?"เวลาออก":"เวลาถึง"} <input type="time" data-f="time" value="${fmtIn(curTime)}"></label>
      ${(isStart||isEnd)?"":`<label>อยู่นาน <input type="number" inputmode="numeric" min="0" step="5" data-f="dur" value="${dur(s)}"> นาที</label>`}
      <div class="erow"><button class="b add" data-e="save">บันทึก</button>
      ${(state.pin[s.k]!=null||state.dur[s.k]!=null)?`<button class="b" data-e="clear">ใช้เวลาอัตโนมัติ</button>`:""}
      <button class="b" data-e="cancel">ปิด</button></div>
      <p class="note">${isStart?"เวลาของทุกจุดถัดไปจะเลื่อนตาม":"ตั้งเวลาถึงเอง (📌) แล้วจุดถัดไปจะคำนวณต่อจากเวลานี้ · \"ใช้เวลาอัตโนมัติ\" เพื่อกลับไปใช้เวลาที่คำนวณจากระยะทาง"}</p>
    </div>`;
  }

  function card(r, inlArr, idx, n){
    const s = r.s, off = !!state.off[s.k], movable = !s.fixed, added = !BASE.includes(s.k);
    let time = "", warn = "", tmin = null;
    if(!off){
      if(s.closed && s.closed.includes(wd)) warn += `<p class="bad">⛔ ปิดวัน${DAYN[wd]} (วันที่ไป)</p>`;
      if(s.inline){ tmin = inlArr[s.k]; time = tmin!=null ? hm(tmin) : ""; }
      else { tmin = r.arr; time = hm(r.arr);
        if(r.wait) warn += `<p class="note">⏳ ถึงก่อนเปิด รอ ~${durTxt(Math.round(r.wait/5)*5)}</p>`;
        if(s.close){ const c=toMin(s.close);
          if(r.arr >= c) warn += `<p class="bad">⛔ ไปถึงหลังเวลาปิด (${s.close}) · ลองยกเลิกหรือย้ายลำดับ</p>`;
          else if(r.dep > c) warn += `<p class="bad">⚠️ ปิด ${s.close} · เหลือเวลาเที่ยวแค่ ~${durTxt(Math.max(0,Math.round((c-r.arr)/5)*5))}</p>`;
        }
      }
    }
    const pinned = state.pin[s.k]!=null, dEdited = state.dur[s.k]!=null;
    const legLine = (!off && !s.inline && r.leg!=null) ? `<div class="leg">🚐 ขับ ~${durTxt(Math.round(r.leg/5)*5)}${(r.inl&&r.inl.length)?" + แวะ"+r.inl.map(x=>x.name.replace("ระหว่างทาง","")).join(", "):""}</div>` : "";
    const ctrls = movable ? `<div class="ctrl">
        ${added ? `<button data-act="rm" data-k="${s.k}" class="b">🗑 ลบ</button>`
          : off ? `<button data-act="on" data-k="${s.k}" class="b on">↩︎ เอากลับ</button>`
                : `<button data-act="off" data-k="${s.k}" class="b">✕ ยกเลิก</button>`}
        <button data-act="up" data-k="${s.k}" class="b" ${idx<=1?"disabled":""}>▲</button>
        <button data-act="down" data-k="${s.k}" class="b" ${idx>=n-2?"disabled":""}>▼</button>
      </div>` : "";
    const hours = (s.open||s.close) ? `<span class="chip">🕘 ${s.open||""}–${s.close||""}</span>` : "";
    const timeBtn = off ? `<div class="time">—</div>` : `<button class="time tbtn ${pinned?"pin":""}" data-edit="${s.k}">${pinned?"📌":""}${time}<span>✏️</span></button>`;
    return `${legLine}<div class="stop ${off?"skip":""} ${added?"added":""}">${timeBtn}<div class="card">
      <h3>${added?"＋ ":""}${esc(s.name)}</h3>
      <div class="chips"><span class="chip t">${esc(s.type)}${dur(s)?" · "+(dEdited?"✏️":"")+durTxt(dur(s)):""}</span>${hours}${s.fee?`<span class="chip fee">💰 ${esc(s.fee)}</span>`:""}</div>
      ${editing===s.k && !off ? editor(s, tmin ?? cfg.start) : ""}
      ${off?`<p class="note">ยกเลิกแล้ว · เวลาด้านล่างคำนวณใหม่แล้ว</p>`:""}
      ${!off&&s.what?`<p>${esc(s.what)}</p>`:""}
      ${!off&&s.note?`<p class="${s.note.includes("⚠️")?"warn":"note"}">${esc(s.note)}</p>`:""}
      ${warn}
      <div class="row">${s.id&&!off?`<a class="nav-btn" href="${P(s.id[0],s.id[1])}">📍 นำทาง</a>`:""}${ctrls}</div>
    </div></div>`;
  }

  function render(){
    const p = plan(), n = state.order.length;
    const active = state.order.map(k=>BY[k]).filter(s=>!s.inline && !state.off[s.k]);
    let h = `<div class="date">📅 ${esc(cfg.dateLabel)}</div>`;
    h += `<a class="route" href="${R(active.map(s=>s.id))}">🗺️ เปิดเส้นทางวันนี้ใน Google Maps</a>`;
    if(active.length>10) h += `<p class="warn">⚠️ จุดแวะเกิน 10 จุด Google Maps อาจไม่รับทั้งหมด</p>`;
    h += `<div class="intro">ออก <b>${hm(p.out[0].arr)}</b> → ${esc(cfg.endLabel)} ราว <b>${hm(p.end)}</b> · ขับรวม ~${durTxt(Math.round(p.drive/5)*5)}
          ${cfg.introNote?`<br>${cfg.introNote}`:""}
          <br><span class="note">แตะที่เวลา ✏️ เพื่อแก้เวลาถึง/เวลาอยู่ของแต่ละจุด</span>
          <div class="tools"><button class="b" data-tool="undo" ${hist.length?"":"disabled"}>↩︎ ย้อนกลับ</button><button class="b" data-tool="reset">รีเซ็ตแผน</button><a class="b" href="#places" data-tool="places">＋ เพิ่มที่เที่ยว</a></div></div>`;
    h += p.out.map((r,i)=>card(r,p.inlArr,i,n)).join("");
    h += `<h2>${esc(cfg.tipsTitle)}</h2><ul class="tips">`+cfg.tips.map(t=>`<li>${esc(t)}</li>`).join("")+`</ul>`;
    if(cfg.cost) h += `<h2>💰 ค่าเข้าโดยประมาณ (ต่อคน)</h2><div class="cost">`+cfg.cost.map(([a,b])=>`<div><span>${esc(a)}</span><span>${esc(b)}</span></div>`).join("")+`</div>`;
    const el = document.getElementById(cfg.el); el.innerHTML = h;
    el.querySelectorAll("button[data-act]").forEach(b=>b.onclick=()=>act(b.dataset.act,b.dataset.k));
    el.querySelectorAll("button[data-edit]").forEach(b=>b.onclick=()=>{ editing = editing===b.dataset.edit ? null : b.dataset.edit; render(); });
    const ed = el.querySelector(".edit");
    if(ed){
      const k = editing;
      ed.querySelector('[data-e="cancel"]').onclick=()=>{ editing=null; render(); };
      const clr = ed.querySelector('[data-e="clear"]'); if(clr) clr.onclick=()=>{ editing=null; commit(()=>{ delete state.pin[k]; delete state.dur[k]; }); };
      ed.querySelector('[data-e="save"]').onclick=()=>{
        const tv = ed.querySelector('[data-f="time"]').value, dv = ed.querySelector('[data-f="dur"]');
        editing=null;
        commit(()=>{
          const cur = plan(), row = cur.out.find(r=>r.s.k===k);
          const auto = BY[k].inline ? cur.inlArr[k] : row && row.arr;
          if(tv){ const m = toMin(tv); if(auto==null || Math.round(m)!==Math.round(auto/5)*5) state.pin[k]=m; }
          if(dv && dv.value!==""){ const v=Math.max(0,Math.round(+dv.value)); if(v!==BY[k].dur) state.dur[k]=v; else delete state.dur[k]; }
        });
      };
    }
    el.querySelector('[data-tool="undo"]').onclick=undo;
    el.querySelector('[data-tool="reset"]').onclick=()=>commit(()=>{ state=clone(DEFAULT); });
    el.querySelector('[data-tool="places"]').onclick=()=>{ placesRegion=cfg.region; placesDay=cfg.day; renderPlaces(); };
  }
  function act(a,k){
    commit(()=>{
      const o=state.order;
      if(a==="off") state.off[k]=true;
      else if(a==="on") delete state.off[k];
      else if(a==="rm"){ const i=o.indexOf(k); if(i>0) o.splice(i,1); delete state.off[k]; delete state.pin[k]; delete state.dur[k]; }
      else if(a==="add"){ if(!o.includes(k)) o.splice(o.length-1,0,k); }
      else { const i=o.indexOf(k), j=a==="up"?i-1:i+1; if(j>=1 && j<=o.length-2) [o[i],o[j]]=[o[j],o[i]]; }
    });
  }
  function undo(){ if(hist.length){ state=hist.pop(); save(); renderAll(); } }
  const api = {render, plan, act, undo, has:k=>state.order.includes(k), wd, day:cfg.day, region:cfg.region, short:cfg.short,
    nearest:(x)=>{ let best=null; for(const k of state.order){ const s=BY[k]; if(s.inline||state.off[k]||s.k===x.k||s.lat==null) continue; const m=roadMin(s,x); if(!best||m<best.m) best={s,m}; } return best; }};
  planners[cfg.day]=api; return api;
}

// ===== แท็บที่เที่ยวเพิ่มเติม =====
let placesRegion = "kk", placesDay = 1;
function renderPlaces(){
  const r = placesRegion, days = Object.values(planners).filter(p=>p.region===r);
  if(!days.some(p=>p.day===placesDay)) placesDay = days[0].day;
  const pl = planners[placesDay];
  let h = `<div class="seg"><button class="b ${r==="kk"?"on":""}" data-reg="kk">เขาค้อ<br><small>วันที่ 1 · จ. 23</small></button><button class="b ${r==="ut"?"on":""}" data-reg="ut">อุทัยธานี<br><small>วันที่ 2–3 · อ. 24–พ. 25</small></button></div>`;
  if(days.length>1) h += `<div class="seg small">`+days.map(p=>`<button class="b ${p.day===placesDay?"on":""}" data-day="${p.day}">เพิ่มเข้า${p.short}</button>`).join("")+`</div>`;
  h += `<div class="intro">กด <b>＋ เพิ่มเข้า${pl.short}</b> แล้วไปจัดลำดับ/แก้เวลาในแท็บวันนั้น · "ใกล้สุด" คิดจากจุดในวันนั้นตอนนี้ (ประมาณ)</div>`;
  for(const [title,items] of EXTRA[r]){
    h += `<h2>${title}</h2><div class="list">`;
    for(const s of items){
      const inDay = days.find(p=>p.has(s.k)), near = pl.nearest(s);
      const closedToday = s.closed && s.closed.includes(pl.wd);
      const hours = (s.open||s.close) ? `<span class="chip">🕘 ${s.open||""}–${s.close||""}</span>` : "";
      h += `<div class="stop ${inDay?"added":""}"><div class="time"></div><div class="card">
        <h3>${esc(s.name)}</h3>
        <div class="chips"><span class="chip t">${esc(s.type)} · ${durTxt(s.dur)}</span>${hours}${s.fee?`<span class="chip fee">💰 ${esc(s.fee)}</span>`:""}</div>
        ${near?`<p class="note">📍 ใกล้สุดใน${pl.short}: ${esc(near.s.name)} ~${durTxt(Math.round(near.m/5)*5)}</p>`:""}
        <p>${esc(s.what)}</p>
        ${s.note?`<p class="${s.note.includes("⚠️")?"warn":"note"}">${esc(s.note)}</p>`:""}
        ${closedToday?`<p class="bad">⛔ ปิดวัน${DAYN[pl.wd]} (${pl.short})</p>`:""}
        <div class="row"><a class="nav-btn" href="${P(s.id[0],s.id[1])}">📍 แผนที่</a><div class="ctrl">
          ${inDay?`<span class="intrip">✓ อยู่ใน${inDay.short}</span><button class="b" data-rm="${s.k}" data-d="${inDay.day}">ลบ</button>`
                 :`<button class="b add" data-add="${s.k}">＋ เพิ่มเข้า${pl.short}</button>`}
        </div></div></div></div>`;
    }
    h += `</div>`;
  }
  const el = document.getElementById("places"); el.innerHTML = h;
  el.querySelectorAll("[data-reg]").forEach(b=>b.onclick=()=>{ placesRegion=b.dataset.reg; renderPlaces(); });
  el.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{ placesDay=+b.dataset.day; renderPlaces(); });
  el.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>pl.act("add",b.dataset.add));
  el.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>planners[+b.dataset.d].act("rm",b.dataset.rm));
}
function renderAll(){ Object.values(planners).forEach(p=>p.render()); renderPlaces(); }
renderAll();

const VIEWS=["day1","day2","day3","places"];
function show(){
  const v=(location.hash||"#day1").slice(1);
  const k=VIEWS.includes(v)?v:"day1";
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===k));
  document.querySelectorAll("#tabs a").forEach(a=>a.classList.toggle("on",a.dataset.v===k));
  try{ window.scrollTo(0,0); }catch(e){}
}
window.addEventListener("hashchange",show);show();
</script>
